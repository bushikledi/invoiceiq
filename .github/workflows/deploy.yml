name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Never let two deploys race. Cancelling an in-flight deploy is safe; two
  # deploys running migrations against one database is not.
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One image serves the API and the worker; only the start command
      # differs. Building twice would let the two drift apart.
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: Run migrations
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Guarded so a fork or an unconfigured repo does not fail the workflow.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Migrations run HERE, as a release step, before any new instance
      # receives traffic — never on application boot. Boot-time migration means
      # every replica races to apply the same DDL, and a failed migration takes
      # the whole service down instead of failing one deploy.
      - name: prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:deploy

  release:
    name: Release to Railway
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy api and worker
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm i -g @railway/cli
          # Same image, two services, different start commands.
          railway redeploy --service api --yes
          railway redeploy --service worker --yes
          railway redeploy --service web --yes

      - name: Smoke test
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          echo "Waiting for readiness at $APP_URL"
          for attempt in $(seq 1 30); do
            if curl -sf "$APP_URL/api/v1/health/ready" > /dev/null; then
              echo "ready after ${attempt}0s"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Service did not become ready — roll back (see the README runbook)"
          exit 1
